# Render blueprint for Denver Curb Alerts.
#
# Two properties of the free plan were launch blockers, and closing them is most of why this file
# looks the way it does. Both are recorded because neither is obvious from the values alone:
#
#   1. A free instance sleeps after inactivity. Reminder dispatch is a setInterval inside this
#      process (see the bottom of server.js), so a sleeping instance sends no reminders at all —
#      which is the entire product. That is why the web service below is `starter` and not `free`.
#   2. A free instance has an ephemeral filesystem, wiped on every deploy and restart. With no
#      DATABASE_URL the server falls back to JSON collections under data/, so accounts, sessions,
#      push subscriptions, reminder plans and Stripe customer ids would all disappear on the next
#      push. That is why the databases: block at the bottom exists and DATABASE_URL is wired to it.
#
# Render's own free Postgres tier is deliberately not used. It is deleted after 30 days, which would
# lose precisely the records the database was added to protect, and would do it quietly — the server
# falls back to JSON files rather than refusing to start, so the first symptom would be customers
# silently signed out with their saved sets gone.
#
# Everything marked `sync: false` is set in the Render dashboard, never committed. The list is kept
# complete on purpose: an unset variable here is not an error, it is a feature that silently answers
# 503 (billing, email) or does nothing at all (push), which is much harder to notice.
services:
  - type: web
    name: denver-curb-alerts
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000

      # Postgres, provisioned by the databases: block at the bottom of this file. Render injects the
      # connection string, which makes this the one variable here not set by hand. If the blueprint
      # is ever applied without that block, the server does not fail — it falls back to JSON files
      # on an ephemeral disk, which is the second blocker described at the top of this file.
      - key: DATABASE_URL
        fromDatabase:
          name: denver-curb-alerts-db
          property: connectionString

      # Web push. All three are required; without them reminders are scheduled and never delivered.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

      # The canonical origin this app is served from. It is what Stripe returns to, what verify and
      # reset links are built from, and — via buildCredentialedOrigins in server.js — what the API
      # will accept a session cookie from. Setting this is how a real domain is adopted; forgetting
      # it is how sign-in breaks on the new hostname with no error anywhere.
      - key: APP_ORIGIN
        sync: false
      # Optional, and only needed to trust an origin that is not APP_ORIGIN — a staging deploy, or
      # the Render subdomain during a domain cutover. Comma-separated, scheme and host only.
      - key: CREDENTIALED_ORIGINS
        sync: false

      # Stripe. The secret key plus at least one price id turns checkout on; without them the
      # billing endpoints answer 503 and the client hides the upgrade controls, so a half-configured
      # deployment is a working free app rather than a broken paid one. The webhook secret is
      # separate because the webhook is what actually grants entitlement — with the key set and the
      # webhook secret missing, customers can pay and never become entitled.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ANNUAL
        sync: false
      # Only needed if the checkout return origin differs from APP_ORIGIN. Normally leave unset.
      - key: STRIPE_RETURN_ORIGIN
        sync: false

      # Transactional email, for address confirmation and password reset. Both must be set or email
      # is off. EMAIL_FROM has to be on a domain verified at Resend, which is why this feature waits
      # on owning a domain — SPF and DKIM cannot be published for an onrender.com subdomain.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Gates every bulk read that would otherwise return other people's records, including the
      # push subscription keys. Unset closes those endpoints, which is the safe default; set it if
      # you need them, and never leave it set to a guessable value.
      - key: ISSUE_REPORT_ADMIN_TOKEN
        sync: false

# The store behind every collection that currently lives in data/: accounts, sessions, push
# subscriptions, reminder plans, password reset tokens and the sign-in throttle counters. Keep this
# in the same region as the web service above; both take Render's default here, so they match.
databases:
  - name: denver-curb-alerts-db
    plan: basic-256mb
    databaseName: denver_curb_alerts
    user: denver_curb_alerts
